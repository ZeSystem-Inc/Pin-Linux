name: Build PinLinux ISO

on:
  workflow_dispatch: # Sadece manuel tetiklenir

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Archiso ve Gerekli Araçları Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y universe
        sudo apt-get update
        sudo apt-get install -y archiso dosfstools mtools

    - name: ISO İmajını Derle (mkarchiso)
      run: |
        sudo mkarchiso -v -w ./work -o ./out .

    - name: Çıktı Dosyasını Yeniden Adlandır ve Sabitle
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        mv $ISO_FILE PinLinux-netinst.iso

    - name: Derlenen ISO'yu GitHub Releases'e Yükle
      uses: softprops/action-gh-release@v1
      with:
        files: out/PinLinux-netinst.iso
        tag_name: latest
        name: "PinLinux Netinst ISO"
        body: "ZeSystem-Inc tarafından manuel olarak tetiklenip derlenen PinLinux netinst ISO imajı."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
