name: Build PinLinux ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Hazırlık Yap ve ISO İmajını Derle
      run: |
        docker run --privileged --rm \
          -v ${{ github.workspace }}:/build \
          -w /build \
          archlinux:latest bash -c "
            pacman -Syu --noconfirm archiso dosfstools mtools && \
            cp -r /usr/share/archiso/configs/releng/syslinux . && \
            cp -r /usr/share/archiso/configs/releng/efiboot . && \
            rm -rf work out && \
            mkarchiso -v -w ./work -o ./out .
          "

    - name: Çıktı Dosyasını Yeniden Adlandır ve Sabitle
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        mv $ISO_FILE PinLinux-netinst.iso

    - name: Derlenen ISO'yu Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: PinLinux-netinst-iso
        path: out/PinLinux-netinst.iso
