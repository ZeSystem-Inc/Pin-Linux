name: Build PinLinux ISO

on:
  workflow_dispatch:
    inputs:
      release_to_github:
        description: "Derlenen ISO'yu GitHub Releases'a otomatik yükle"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Releases'a dosya yükleyebilmek için zorunlu yetki
    container:
      image: archlinux:latest
      options: --privileged

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Pacman Önbelleğini (Cache) Hazırla
      uses: actions/cache@v4
      with:
        path: pacman-cache
        key: pacman-cache-${{ runner.os }}-${{ hashFiles('packages.x86_64') }}
        restore-keys: |
          pacman-cache-${{ runner.os }}-

    - name: Sistem Paketlerini Güncelle ve Archiso Kur
      run: |
        mkdir -p /var/cache/pacman/pkg
        cp -rn pacman-cache/* /var/cache/pacman/pkg/ 2>/dev/null || true
        pacman -Syu --noconfirm archiso dosfstools mtools grub
        mkdir -p pacman-cache
        cp -rn /var/cache/pacman/pkg/* pacman-cache/ 2>/dev/null || true

    - name: ISO Profilini Hazırla
      run: |
        rm -rf work out myprofile
        cp -r /usr/share/archiso/configs/releng myprofile

        # releng paketleri + senin paketlerin (yorumlar ve tekrarlar elenir)
        cat /usr/share/archiso/configs/releng/packages.x86_64 packages.x86_64 \
          | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' \
          | sort -u > myprofile/packages.x86_64

        # Senin airootfs dosyaların releng'in üstüne yazılır
        if [ -d "airootfs" ]; then
          cp -rT airootfs myprofile/airootfs
        fi

        # archiso hook paketi mutlaka listede olmalı
        grep -qx 'mkinitcpio-archiso' myprofile/packages.x86_64 \
          || echo "mkinitcpio-archiso" >> myprofile/packages.x86_64

        # ISO kimliği
        sed -i \
          -e 's|^iso_name=.*|iso_name="pinlinux"|' \
          -e 's|^iso_label=.*|iso_label="PINLINUX_$(date +%Y%m)"|' \
          -e 's|^iso_publisher=.*|iso_publisher="PinLinux Project <https://github.com/ZeSystem-Inc>"|' \
          -e 's|^iso_application=.*|iso_application="PinLinux Installer"|' \
          myprofile/profiledef.sh

        # Kurulum scriptine çalıştırma izni
        echo 'file_permissions+=(["/usr/local/bin/pin-setup"]="0:0:755")' >> myprofile/profiledef.sh

        # Önyükleme menüsündeki "Arch Linux" yazılarını değiştir
        sed -i 's/Arch Linux/Pin Linux/g' \
          myprofile/syslinux/*.cfg myprofile/grub/*.cfg 2>/dev/null || true
        sed -i 's/Arch Linux/Pin Linux/g' \
          myprofile/efiboot/loader/entries/*.conf 2>/dev/null || true

    - name: ISO'yu Derle
      run: |
        mkarchiso -v -w ./work -o ./out myprofile 2>&1 | tee build.log
        # initramfs hook hatası olursa derlemeyi burada durdur
        if grep -qE "Hook '.*' cannot be found" build.log; then
          echo "::error::initramfs hook hatası var, ISO bozuk olurdu"
          grep -E "Hook '.*' cannot be found" build.log
          exit 1
        fi

    - name: Çıktı Dosyasını Yeniden Adlandır
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        mv "$ISO_FILE" PinLinux-netinst-rolling.iso

    - name: Derlenen ISO'yu Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: PinLinux-netinst-rolling
        path: out/PinLinux-netinst-rolling.iso

    - name: GitHub Release Güncelle ve Yayınla
      if: ${{ inputs.release_to_github == true }}
      uses: softprops/action-gh-release@v2
      with:
        files: out/PinLinux-netinst-rolling.iso
        tag_name: rolling
        name: "PinLinux Netinstall (Rolling)"
        body: "PinLinux Rolling Release netinstall kalıbı. Her derlemede en güncel paketlerle otomatik olarak yenilenir."
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
