name: Build PinLinux ISO

on:
  workflow_dispatch:
    inputs:
      release_to_github:
        description: 'Derlenen ISO'yu GitHub Releases a otomatik yükle'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Pacman Önbelleğini (Cache) Hazırla
      uses: actions/cache@v4
      with:
        path: pacman-cache
        key: pacman-cache-${{ runner.os }}-${{ hashFiles('packages.x86_64') }}
        restore-keys: |
          pacman-cache-${{ runner.os }}-

    - name: Sistem Paketlerini Güncelle ve Archiso Kur
      run: |
        mkdir -p /var/cache/pacman/pkg
        cp -rn pacman-cache/* /var/cache/pacman/pkg/ 2>/dev/null || true
        pacman -Syu --noconfirm archiso dosfstools mtools grub
        mkdir -p pacman-cache
        cp -rn /var/cache/pacman/pkg/* pacman-cache/ 2>/dev/null || true

    - name: ISO Profilini Hazırla ve Derle
      run: |
        rm -rf work out myprofile
        cp -r /usr/share/archiso/configs/releng myprofile
        cp packages.x86_64 myprofile/packages.x86_64
        
        if [ -d "airootfs" ]; then
          cp -rT airootfs myprofile/airootfs
        fi
        
        mkarchiso -v -w ./work -o ./out myprofile

    - name: Çıktı Dosyasını Yeniden Adlandır ve Versiyonla
      id: rename_iso
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        NEW_NAME="PinLinux-netinst-$(date +%Y%m%d).iso"
        mv $ISO_FILE $NEW_NAME
        echo "iso_name=$NEW_NAME" >> $GITHUB_OUTPUT
        echo "iso_path=out/$NEW_NAME" >> $GITHUB_OUTPUT

    - name: Derlenen ISO'yu Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: PinLinux-netinst-iso
        path: ${{ steps.rename_iso.outputs.iso_path }}

    - name: GitHub Release Oluştur ve Yayınla
      if: ${{ inputs.release_to_github == true }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.rename_iso.outputs.iso_path }}
        tag_name: v$(date +%Y.%m.%d-%H%M)
        name: "PinLinux Netinstall ISO - $(date +%Y-%m-%d)"
        body: "Bu sürüm GitHub Actions üzerinden otomatik olarak derlenmiştir."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
