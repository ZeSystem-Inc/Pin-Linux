name: Build PinLinux ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Pacman Önbelleğini (Cache) Hazırla
      uses: actions/cache@v4
      with:
        path: pacman-cache
        key: pacman-cache-${{ runner.os }}-${{ hashFiles('packages.x86_64') }}
        restore-keys: |
          pacman-cache-${{ runner.os }}-

    - name: Arch Linux CHROOT / Bootstrap Ortamı Kur ve Derle
      uses: mekeor/action-arch-chroot@v1
      with:
        foreign-packages: |
          archiso
          dosfstools
          mtools
          grub
        run: |
          # Önbellek dizinini bağla/ayarla
          mkdir -p /var/cache/pacman/pkg
          cp -rn /build/pacman-cache/* /var/cache/pacman/pkg/ 2>/dev/null || true

          # Çalışma alanını temizle ve releng şablonunu oluştur
          rm -rf work out myprofile
          cp -r /usr/share/archiso/configs/releng myprofile
          cp /build/packages.x86_64 myprofile/packages.x86_64
          cp /build/profiledef.sh myprofile/profiledef.sh

          # ISO'yu derle
          mkarchiso -v -w ./work -o ./out myprofile

          # İndirilen yeni paketleri önbelleğe geri kopyala
          mkdir -p /build/pacman-cache
          cp -rn /var/cache/pacman/pkg/* /build/pacman-cache/ 2>/dev/null || true

    - name: Çıktı Dosyasını Yeniden Adlandır ve Sabitle
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        mv $ISO_FILE PinLinux-netinst.iso

    - name: Derlenen ISO'yu Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: PinLinux-netinst-iso
        path: out/PinLinux-netinst.iso
