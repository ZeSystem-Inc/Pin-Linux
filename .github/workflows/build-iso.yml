name: Build PinLinux ISO

on:
  workflow_dispatch: # Sadece GitHub arayüzünden manuel tetiklenir

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Temizlik Yap ve ISO İmajını Derle
      run: |
        docker run --privileged --rm \
          -v ${{ github.workspace }}:/build \
          -w /build \
          archlinux:latest bash -c "
            rm -rf work out && \
            pacman -Syu --noconfirm archiso dosfstools mtools && \
            mkarchiso -v -w ./work -o ./out .
          "

    - name: Çıktı Dosyasını Yeniden Adlandır ve Sabitle
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        mv $ISO_FILE PinLinux-netinst.iso

    - name: Derlenen ISO'yu GitHub Releases'e Yükle
      uses: softprops/action-gh-release@v1
      with:
        files: out/PinLinux-netinst.iso
        tag_name: latest
        name: "PinLinux Netinst ISO"
        body: "ZeSystem-Inc tarafından Docker ortamında temiz derlenen PinLinux netinst ISO imajı."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
