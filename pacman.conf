#
# /etc/pacman.conf
#
# Pin Linux Pacman Konfigürasyonu

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Paralel indirme desteği (kurulumu hızlandırır)
ParallelDownloads = 5

# Güven anahtarları ve veritabanı ayarları
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Eğer ileride kendi özel paketlerin için ek depo açmak istersen buraya ekleyebilirsin:
#[pinlinux-repo]
#Server = https://zesystem-inc.github.io/pinlinux/repo/$arch
