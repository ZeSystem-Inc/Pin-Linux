---
# Pin Linux Calamares Ana Konfigürasyonu

modules-search: [ "$(qt5paths --plugin-dir)" ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fskcheck
      - fstab
      - locale
      - keyboard
      - localecfg
      - networkcfg
      - hwclock
      - services-systemd
      - initcramfs
      - grubcfg
      - bootloader
      - netinstall
      - umount
  - show:
      - finished

# Hata ayıklama modunu aktif tutar, sorun anında loglarda görünür
branding: pinlinux
prompt-install: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: false
